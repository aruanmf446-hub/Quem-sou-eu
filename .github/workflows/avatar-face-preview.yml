name: Prévia rápida — rostos cartoon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/avatar-face-preview.yml'
      - 'scripts/avatar/sculpt_face.py'
      - 'scripts/avatar/spec.py'
      - 'scripts/avatar/build_items.py'
      - 'scripts/avatar/eyes.py'
      # Alterações de interface/shader já são verificadas no build do Pages.
      # A comparação antes/depois só deve rodar ao mudar a geração das malhas.

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/avatar/requirements.txt
      - name: Instalar ferramentas locais
        run: |
          python -m pip install -r scripts/avatar/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Iniciar a prévia do próprio jogo
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vite.log
          exit 1
      - name: Capturar os arquivos publicados antes da mudança
        run: |
          mkdir -p /tmp/cartoon-preview
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/antes-camisa10.png 'bundle=striker&view=face' 780 980
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/antes-voltaico.png 'bundle=volt&view=face' 780 980
      - name: Esculpir base, olhos, sobrancelhas e cachos sem API
        run: |
          python3 scripts/avatar/build_base.py
          python3 scripts/avatar/build_items.py hair_curly_fade brows_thick beard_goatee hair_spiky top_lab_coat
          node scripts/avatar/optimize.mjs public/avatar/base.glb public/avatar/items/hair_curly_fade.glb public/avatar/items/brows_thick.glb public/avatar/items/beard_goatee.glb public/avatar/items/hair_spiky.glb public/avatar/items/top_lab_coat.glb
      - name: Conferir build e retratos com as novas malhas
        run: |
          npm run build
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/depois-camisa10.png 'bundle=striker&view=face' 780 980
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/depois-voltaico.png 'bundle=volt&view=face' 780 980
      - name: Validar reconstrução, idempotência e diferença visual quando houver nova malha
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image

          # Sem diff binário = a malha publicada já representa o gerador atual.
          # Mudanças de materiais/iluminação não precisam alterar a geometria.
          assets = {
              'camisa10': ['base.glb', 'items/hair_curly_fade.glb', 'items/brows_thick.glb', 'items/beard_goatee.glb'],
              'voltaico': ['base.glb', 'items/hair_spiky.glb', 'items/brows_thick.glb'],
          }
          changed = set()
          for item in sorted(set(sum(assets.values(), []))):
              p = Path('public/avatar') / item
              if not p.is_file() or p.stat().st_size < 1024:
                  raise SystemExit(f'Asset ausente ou vazio: {p}')
              result = subprocess.run(['git', 'diff', '--quiet', '--', str(p)], check=False)
              if result.returncode not in (0, 1):
                  raise SystemExit(f'Erro verificando {p}')
              if result.returncode == 1:
                  changed.add(item)
          print('GLBs regenerados com alterações:', sorted(changed) or '(nenhuma — idempotente)')
          for name, related in assets.items():
              a = np.asarray(Image.open(f'/tmp/cartoon-preview/antes-{name}.png').convert('RGB'), np.float32)
              b = np.asarray(Image.open(f'/tmp/cartoon-preview/depois-{name}.png').convert('RGB'), np.float32)
              if a.shape != b.shape:
                  raise SystemExit(f'Fotos incompatíveis: {name}')
              score = float(np.abs(a - b).mean())
              print(f'{name}: diferença visual {score:.2f}/255')
              if changed.intersection(related) and score < 1.3:
                  raise SystemExit(f'Nova malha de {name} sem diferença visual suficiente')
          if not changed:
              print('OK: reconstrução determinística; não há alteração geométrica a exigir.')
          PY
      - name: Disponibilizar evidências para revisão da arte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retratos-cartoon-antes-depois
          path: /tmp/cartoon-preview/*.png
          if-no-files-found: warn
