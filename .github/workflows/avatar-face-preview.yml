name: Prévia rápida — rostos cartoon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/avatar-face-preview.yml'
      - 'scripts/avatar/sculpt_face.py'
      - 'scripts/avatar/spec.py'
      - 'scripts/avatar/build_items.py'
      - 'scripts/avatar/eyes.py'
      - 'src/avatar/config.ts'
      - 'src/avatar/catalog.ts'
      - 'src/avatar/stage.ts'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/avatar/requirements.txt
      - name: Instalar ferramentas locais
        run: |
          python -m pip install -r scripts/avatar/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Iniciar a prévia do próprio jogo
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vite.log
          exit 1
      - name: Capturar os arquivos publicados antes da mudança
        run: |
          mkdir -p /tmp/cartoon-preview
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/antes-camisa10.png 'bundle=striker&view=face' 780 980
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/antes-voltaico.png 'bundle=volt&view=face' 780 980
      - name: Esculpir base, olhos, sobrancelhas e cachos sem API
        run: |
          python3 scripts/avatar/build_base.py
          python3 scripts/avatar/build_items.py hair_curly_fade brows_thick beard_goatee hair_spiky top_lab_coat
          node scripts/avatar/optimize.mjs public/avatar/base.glb public/avatar/items/hair_curly_fade.glb public/avatar/items/brows_thick.glb public/avatar/items/beard_goatee.glb public/avatar/items/hair_spiky.glb public/avatar/items/top_lab_coat.glb
      - name: Conferir build e retratos com as novas malhas
        run: |
          npm run build
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/depois-camisa10.png 'bundle=striker&view=face' 780 980
          node scripts/avatar/preview/shoot.mjs /tmp/cartoon-preview/depois-voltaico.png 'bundle=volt&view=face' 780 980
      - name: Exigir transformação visual real
        run: |
          python - <<'PY'
          import numpy as np
          from PIL import Image
          for name in ('camisa10','voltaico'):
              a=np.asarray(Image.open(f'/tmp/cartoon-preview/antes-{name}.png').convert('RGB'),np.float32)
              b=np.asarray(Image.open(f'/tmp/cartoon-preview/depois-{name}.png').convert('RGB'),np.float32)
              score=float(np.abs(a-b).mean())
              print(f'{name} diferença visível: {score:.2f}/255')
              if score < 1.3: raise SystemExit(f'Falha: {name} não teve mudança geométrica visível')
          PY
      - name: Disponibilizar evidências para revisão da arte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retratos-cartoon-antes-depois
          path: /tmp/cartoon-preview/*.png
          if-no-files-found: warn
