name: Reconstrução visual dos avatares 3D

on:
  push:
    branches: [main]
    paths:
      - 'scripts/avatar/*.py'
      - 'src/avatar/stage.ts'
      - 'src/avatar/Avatar.ts'
      - 'src/avatar/AvatarView.tsx'
      - 'src/avatar/config.ts'
      - 'src/avatar/catalog.ts'
      - 'src/screens/AvatarStudio.tsx'
      - 'scripts/avatar/preview/**'
      - '.github/workflows/avatar-cinematico.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avatar-cinematico-main
  cancel-in-progress: true

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Buscar código e assets originais
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/avatar/requirements.txt
      - name: Instalar bibliotecas locais
        run: |
          python -m pip install -r scripts/avatar/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Abrir cenário real de prévia do jogo
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/avatar-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/avatar-vite.log
          exit 1
      - name: Fotografar GLBs originais com câmera equivalente
        run: |
          mkdir -p art-direction/volt
          node scripts/avatar/preview/shoot.mjs art-direction/volt/antes-corpo.png 'bundle=volt&fit=all&pad=1.09&az=.3&el=.07' 780 1060
          node scripts/avatar/preview/shoot.mjs art-direction/volt/antes-rosto.png 'bundle=volt&view=face' 780 980
          mkdir -p art-direction/camisa10
          node scripts/avatar/preview/shoot.mjs art-direction/camisa10/antes-corpo.png 'bundle=striker&fit=all&pad=1.09&az=.3&el=.07' 780 1060
          node scripts/avatar/preview/shoot.mjs art-direction/camisa10/antes-rosto.png 'bundle=striker&view=face' 780 980
      - name: Regenerar malhas e GLBs pelo pipeline do repositório
        run: npm run assets:build
      - name: Compilar aplicação e executar testes de esqueleto, morphs, itens e danças
        run: |
          npm run build
          npm test
      - name: Regenerar miniaturas de todos os visuais e peças
        run: npm run assets:thumbs
      - name: Fotografar o Voltaico reconstruído
        run: |
          node scripts/avatar/preview/shoot.mjs art-direction/volt/depois-corpo.png 'bundle=volt&fit=all&pad=1.09&az=.3&el=.07' 780 1060
          node scripts/avatar/preview/shoot.mjs art-direction/volt/depois-rosto.png 'bundle=volt&view=face' 780 980
          node scripts/avatar/preview/shoot.mjs art-direction/volt/depois-danca.png 'bundle=volt&anim=groove&t=.58&view=full' 780 1060
          node scripts/avatar/preview/shoot.mjs art-direction/camisa10/depois-corpo.png 'bundle=striker&fit=all&pad=1.09&az=.3&el=.07' 780 1060
          node scripts/avatar/preview/shoot.mjs art-direction/camisa10/depois-rosto.png 'bundle=striker&view=face' 780 980
          node scripts/avatar/preview/shoot.mjs art-direction/camisa10/depois-danca.png 'bundle=striker&anim=samba&t=.8&view=full' 780 1060
      - name: Comprovar diferenças reais nos GLBs
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          for item in ['base.glb', 'items/hair_spiky.glb', 'items/top_lab_coat.glb']:
              p = Path('public/avatar') / item
              if not p.exists() or p.stat().st_size < 1024:
                  raise SystemExit(f'GLB ausente ou vazio: {p}')
              original = subprocess.check_output(['git', 'show', 'HEAD:' + str(p)])
              atual = p.read_bytes()
              if atual == original:
                  raise SystemExit(f'Malha não mudou: {p}')
              print(f'Geometria alterada: {p} ({len(original)} -> {len(atual)} bytes)')
          PY
      - name: Verificar se a escultura realmente mudou os rostos
        run: |
          python - <<'PY'
          import numpy as np
          from PIL import Image
          for folder in ('volt', 'camisa10'):
              a = np.asarray(Image.open(f'art-direction/{folder}/antes-rosto.png').convert('RGB'), np.float32)
              b = np.asarray(Image.open(f'art-direction/{folder}/depois-rosto.png').convert('RGB'), np.float32)
              change = float(np.abs(a-b).mean())
              print(f'{folder}: diferença média do retrato {change:.2f}/255')
              if change < 1.3:
                  raise SystemExit(f'Escultura sem diferença perceptível no retrato: {folder}')
          PY
      - name: Testar fluxo real do jogador em desktop e celular
        run: node scripts/avatar/preview/e2e.mjs art-direction/volt/teste
      - name: Guardar fotografias e evidências do pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltaico-antes-depois-e-qa
          path: |
            art-direction/volt/*.png
            art-direction/camisa10/*.png
          if-no-files-found: warn
      - name: Publicar assets e capturas aprovados na main
        run: |
          git config user.name "Pipeline do Estúdio 3D"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/avatar/base.glb public/avatar/items public/avatar/thumbs src/avatar/assetVersions.json art-direction/volt art-direction/camisa10
          if ! git diff --cached --quiet; then
            git commit -m "Regenerar malhas 3D, miniaturas e provas visuais"
            git push origin HEAD:main
          fi
